name: Idea or request
description: Suggest a feature or a change
labels: ["idea"]
body:
  - type: dropdown
    id: addon
    attributes:
      label: Addon
      options:
        - OnlyOres
        - OnlyHerbs
        - OnlyEnchants
        - OnlyNotes
        - WowTogether
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and what would it help you do?
    validations:
      required: true
