<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanks · HotZip Addons</title>
<meta name="description" content="Your report was sent.">
<meta name="theme-color" content="#0D1018">
<meta property="og:title" content="Thanks · HotZip Addons">
<meta property="og:description" content="Your report was sent.">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><img src="/assets/logo.svg" alt=""><span><span class="hot">Hot</span>Zip Addons</span></a>
    <nav aria-label="Main">
      <a href="/addons/">Addons</a>
      <a href="/support/" aria-current="page">Support</a>
    </nav>
  </div>
</header>
<main>
<section class="wrap page-head">
  <h1>Got it, thanks.</h1>
  <p class="muted">Your report is in.</p>
  <p id="issue-link" hidden>You can follow it here: <a href="#"></a></p>
  <div class="actions">
    <a class="btn btn-ghost" href="/addons/">Back to addons</a>
  </div>
</section>
<script>
  // Only link issues in our own repo.
  (function () {
    var url = new URLSearchParams(location.search).get("issue") || "";
    if (url.indexOf("https://github.com/HotZip-Dev/hotzip-support/issues/") !== 0) return;
    var p = document.getElementById("issue-link"), a = p.querySelector("a");
    a.href = url; a.textContent = url.replace("https://", "");
    p.hidden = false;
  })();
</script>
</main>
<footer class="site-footer">
  <div class="wrap">
    <nav aria-label="Footer">
      <a href="/support/">Support</a>
    </nav>
  </div>
</footer>
</body>
</html>
